    for (var i = nodes.length - 1; i >= 0; i--) {
      var n = nodes[i];
      var dx = n.x - w.x, dy = n.y - w.y;
      if (dx * dx + dy * dy <= Math.pow(nodeRadius(n) + 4, 2)) return n;
    }
    return null;
  }
  canvas.addEventListener('mousedown', function (ev) {
    var n = pick(ev.offsetX, ev.offsetY);
    if (n) { drag = { node: n, moved: false, hit: n }; n.pinned = true; }
    else { drag = { pan: true, sx: ev.offsetX, sy: ev.offsetY, vx: view.x, vy: view.y, moved: false, hit: null }; }
  });
  window.addEventListener('mousemove', function (ev) {
    if (!drag) return;
    drag.moved = true;
    var rect = canvas.getBoundingClientRect();
    var ox = ev.clientX - rect.left, oy = ev.clientY - rect.top;
    if (drag.node) { var w = toWorld(ox, oy); drag.node.x = w.x; drag.node.y = w.y; }
    else if (drag.pan) { view.x = drag.vx + (ox - drag.sx); view.y = drag.vy + (oy - drag.sy); }
  });
  window.addEventListener('mouseup', function () {
    if (drag && !drag.moved) { selectNode(drag.hit ? drag.hit.id : null); } // clic simple = sélection
    if (drag && drag.node) drag.node.pinned = false;
    drag = null;
  });
  canvas.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var factor = ev.deltaY < 0 ? 1.1 : 0.9;
    var w = toWorld(ev.offsetX, ev.offsetY);
    view.scale *= factor;
    view.x = ev.offsetX - w.x * view.scale;
    view.y = ev.offsetY - w.y * view.scale;
  }, { passive: false });

  // recherche
  document.getElementById('search').addEventListener('input', function (e) {
    search = e.target.value.toLowerCase();
  });

  // toggle "cycles only"
  document.getElementById('cyclesOnly').addEventListener('change', function (e) {
    cyclesOnly = e.target.checked;
  });

  // sélection d'un nœud → panneau de détail (chemin, fan-in/out, imports, importateurs)
  var detail = document.getElementById('detail');
  function row(title, ids) {
    if (!ids.length) return '';
    var items = ids.slice(0, 40).map(function (id) {
      return '<li>' + id.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</li>';
    }).join('');
    return '<div class="d-sec"><div class="d-h">' + title + ' (' + ids.length + ')</div><ul>' + items + '</ul></div>';
  }
  function selectNode(id) {
    selected = id;
    if (!id) { detail.style.display = 'none'; highlight = null; return; }
    var n = index[id];
    detail.style.display = 'block';
    detail.innerHTML =
      '<div class="d-top"><span class="d-name">' + id.split('/').pop() + '</span>' +
      '<button id="d-close">✕</button></div>' +
      '<div class="d-path">' + id.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</div>' +
      '<div class="d-tags">' + (n.inCycle ? '<span class="d-tag cyc">in cycle</span>' : '') +
        '<span class="d-tag">fan-in ' + n.fanIn + '</span><span class="d-tag">fan-out ' + n.fanOut + '</span></div>' +
      row('imports', importsOf[id]) + row('imported by', importersOf[id]);
    document.getElementById('d-close').addEventListener('click', function () { selectNode(null); });
  }

  // liste des cycles : cliquer surligne et recentre
  function focusCycle(group) {
    highlight = {};
    group.forEach(function (id) { highlight[id] = true; });
    var xs = group.map(function (id) { return index[id].x; });
    var ys = group.map(function (id) { return index[id].y; });
    var cx = xs.reduce(function (a, b) { return a + b; }, 0) / xs.length;
    var cy = ys.reduce(function (a, b) { return a + b; }, 0) / ys.length;
    view.scale = 1.3;
    view.x = canvas.clientWidth / 2 - cx * view.scale;
    view.y = canvas.clientHeight / 2 - cy * view.scale;
  }
  var list = document.getElementById('cycles');
  if (DATA.cyclePaths.length === 0) {
    list.innerHTML = '<div class="ok">No circular dependencies detected 🎉</div>';
  } else {
    DATA.cyclePaths.forEach(function (path, i) {
      var labels = path.map(function (id) { return id.split('/').pop(); });
      if (labels.length > 1 && labels[0] !== labels[labels.length - 1]) labels.push(labels[0]);
      var chain = labels.join(' → ');
      var div = document.createElement('div');
      div.className = 'cycle';
      var badge = document.createElement('span');
      badge.className = 'cy-badge';
      badge.textContent = 'cycle ' + (i + 1);
      var chainEl = document.createElement('span');
      chainEl.className = 'cy-chain';
      chainEl.textContent = chain; // textContent → pas d'injection HTML via un nom de fichier
      div.appendChild(badge);
      div.appendChild(chainEl);
      div.title = path.join('  →  ');
      div.addEventListener('click', function () { focusCycle(DATA.cycleGroups[i]); });
      list.appendChild(div);
    });
  }
  document.getElementById('reset').addEventListener('click', function () {
    highlight = null;
    selectNode(null);
    view.scale = 1;
    view.x = canvas.clientWidth / 2;
    view.y = canvas.clientHeight / 2;
  });
})();
</script>
</body>
</html>
