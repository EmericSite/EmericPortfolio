  citation: >
    Through motion design, I explore narrative, atmosphere, and visual identity
    to create striking and memorable imagery.
  citationLegende: — Statement / EN

  approche:
    - tag: Méthode
      texte: >
        I turn products and services into memorable motion experiences, combining design, motion, and 3D to create work that communicates, connects, and resonates emotionally.
    - tag: Direction
      texte: >
        I approach motion through art direction, composition, lighting, rhythm, and sound. Every technical choice serves the emotion, never the other way around.

