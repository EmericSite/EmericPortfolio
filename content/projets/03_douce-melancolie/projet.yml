description: >
  Recherche personnelle sur la lenteur. Une pièce qui refuse l'efficacité et
  préfère le silence, le brouillard, le poids du temps qui passe. Texture,
  lumière diffuse, presque rien — et pourtant la sensation que quelque chose
  va arriver.

