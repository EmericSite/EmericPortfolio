blurb: >
  Japanese Philosophy, Beauty of Impermanence, Poetic Motion, Mono No Aware 物の哀れ

description: >
  Nowadays, Japanese culture is mainly known through its popular culture, rather than its fundamentals, which nevertheless dictate the principles of Japanese society. 
  This philosophical current, this way of seeing things in the same way as the beauty of imperfection, follows this logic: every moment is unique and is inscribed in a temporality, so we must cherish it because we do not know what tomorrow will bring.
  At a time when cultural representations circulate quickly and are often simplified into clichés, it seemed essential to me to return to a more intimate, sensitive, almost silent vision of what makes this culture so unique.
  This project is an attempt to visually translate this emotion:
  that of a fragile, beautiful, and transitory world.

