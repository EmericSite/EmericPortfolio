description: >
  "COME, TORMENT" is a student project completed in one week with the challenge of creating a 30-second video using the word “come.” 
  I wanted to have fun and explore a universe that blends pop and Gothic styles to tell the story of a human's ascension in his kingdom of martyrdom. 
  As he walks toward his throne, the ground builds up beneath his feet and the tiles line up one after the other. 

