description: >
  What matters to Dofus players isn't just the big quests, but also the little fragments of their experience: drops, battles, chilling afternoons at the Zaap.
  These fragments awaken memories and emotions, creating intimate and unique recollections.
  The video captures these sensory moments so that veterans can recognize themselves and newcomers will want to discover this world.

